<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://backend-8occ.onrender.com wss://backend-8occ.onrender.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Live Chat Support ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100dvh; overflow: hidden; }
        .app-container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; width: 100%; max-width: 420px; height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        @media (max-width: 500px) { .app-container { height: 100dvh; max-width: 100%; border-radius: 0; border: none; } }
        #login { display: flex; flex-direction: column; justify-content: center; padding: 40px 30px; height: 100%; text-align: center; animation: fadeIn 0.5s ease; }
        .emoji-header { font-size: 50px; margin-bottom: 10px; animation: bounce 2s infinite; }
        #login h3 { font-size: 24px; font-weight: 700; margin-bottom: 8px; background: linear-gradient(to right, #a8c0ff, #3f2b96); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #login p { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 30px; }
        .input-wrapper { text-align: left; margin-bottom: 20px; }
        .input-wrapper label { font-size: 12px; font-weight: 600; color: #a8c0ff; margin-left: 10px; margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: 1px;}
        input { width: 100%; padding: 16px 20px; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; font-size: 14px; color: #fff; outline: none; transition: 0.3s; }
        input::placeholder { color: rgba(255, 255, 255, 0.3); }
        input:focus { border-color: #a8c0ff; background: rgba(0, 0, 0, 0.4); box-shadow: 0 0 15px rgba(168, 192, 255, 0.2); }
        .btn-primary { width: 100%; padding: 16px; margin-top: 10px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 16px; cursor: pointer; font-weight: 600; font-size: 15px; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-primary:active { transform: scale(0.97); }
        #chat-area { display: none; flex-direction: column; height: 100%; animation: fadeIn 0.4s ease; }
        .chat-header { padding: 20px; background: rgba(0, 0, 0, 0.2); border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; align-items: center; }
        .chat-header .title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px;}
        .chat-header .badge { background: rgba(168, 192, 255, 0.2); color: #a8c0ff; padding: 4px 10px; border-radius: 20px; font-size: 11px; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        #messages::-webkit-scrollbar { width: 4px; }
        #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .msg { padding: 12px 16px; border-radius: 20px; width: fit-content; max-width: 85%; font-size: 14px; line-height: 1.5; word-wrap: break-word; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .msg.me { background: linear-gradient(135deg, #667eea, #764ba2); color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .msg.other { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); color: #fff; margin-right: auto; border-bottom-left-radius: 4px; }
        .sender-name { font-size: 10px; font-weight: 600; margin-bottom: 4px; opacity: 0.6; display: block; text-transform: uppercase; letter-spacing: 0.5px;}
        .chat-footer { padding: 15px 20px; background: rgba(0, 0, 0, 0.3); border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .input-group { display: flex; gap: 10px; background: rgba(0, 0, 0, 0.4); padding: 6px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-group input { background: transparent; border: none; box-shadow: none; padding: 10px 15px; }
        .input-group input:focus { background: transparent; }
        .send-btn { background: #a8c0ff; color: #302b63; border: none; border-radius: 50px; padding: 0 20px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .send-btn:active { transform: scale(0.9); }
        .btn-danger { width: 100%; background: transparent; color: #ff6b6b; border: 1px solid rgba(255, 107, 107, 0.3); border-radius: 50px; padding: 10px; font-size: 12px; font-weight: 600; margin-top: 10px; cursor: pointer; transition: 0.3s; }
        .btn-danger:hover { background: rgba(255, 107, 107, 0.1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="login">
            <div class="emoji-header">✨</div>
            <h3>Mulai Ngobrol</h3>
            <p>Masukkan tiket rahasiamu untuk terhubung dengan tim Sanlucid.</p>
            <div class="input-wrapper">
                <label>🎫 Tiket Akses</label>
                <input type="text" id="ticket" placeholder="Contoh: TRX-8899" autocomplete="off">
            </div>
            <div class="input-wrapper">
                <label>👤 Nama Kamu</label>
                <input type="text" id="name" placeholder="Panggil aku..." autocomplete="off">
            </div>
            <button class="btn-primary" onclick="startChat()">Join Chat 🚀</button>
        </div>
        <div id="chat-area">
            <div class="chat-header">
                <div class="title">
                    <span>🟢 Live Support</span>
                </div>
                <div class="badge" id="ticket-display"></div>
            </div>
            <div id="messages"></div>
            <div class="chat-footer">
                <div class="input-group">
                    <input type="text" id="msgInput" placeholder="Ketik pesan..." autocomplete="off" onkeypress="if(event.key==='Enter') sendMsg()">
                    <button class="send-btn" onclick="sendMsg()">Kirim</button>
                </div>
                <button class="btn-danger" onclick="endChat()">Akhiri & Hapus Chat ✌️</button>
            </div>
        </div>
    </div>
    <script>
        const BACKEND_API = "https://backend-8occ.onrender.com";
        const BACKEND_WS = "wss://backend-8occ.onrender.com";
        let ws;
        let currentTicket = "";
        let currentName = "";
        let isConnecting = false;
        let isEndingChat = false;
        let lastMsgTime = 0;

        const escapeHTML = (str) => {
            if (typeof str !== 'string') return '';
            return str.replace(/[&<>'"]/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            })[m]);
        };

        const validateString = (str, maxLength) => {
            if (!str || typeof str !== 'string') return "";
            return str.trim().substring(0, maxLength);
        };

        window.onload = () => {
            try {
                const savedTicket = localStorage.getItem('sanlucid_ticket');
                const savedName = localStorage.getItem('sanlucid_name');
                if (savedTicket && savedName) {
                    document.getElementById('ticket').value = validateString(savedTicket, 50);
                    document.getElementById('name').value = validateString(savedName, 50);
                    startChat();
                }
            } catch (e) {
                console.error(e);
            }
        };

        async function startChat() {
            if (isConnecting) return;
            isConnecting = true;

            const rawTicket = document.getElementById('ticket').value;
            const rawName = document.getElementById('name').value;
            
            currentTicket = validateString(rawTicket, 50);
            currentName = validateString(rawName, 50);
            
            if (!currentTicket || !currentName) {
                alert("Isi dulu tiket sama nama kamu ya! 😉");
                isConnecting = false;
                return;
            }
            if (currentName.toLowerCase() === "admin") {
                alert("Ups! Nama 'Admin' udah ada yang punya. Pakai nama lain ya! ✌️");
                isConnecting = false;
                return;
            }

            try {
                localStorage.setItem('sanlucid_ticket', currentTicket);
                localStorage.setItem('sanlucid_name', currentName);
            } catch (e) {}

            document.getElementById('login').style.display = 'none';
            document.getElementById('chat-area').style.display = 'flex';
            document.getElementById('ticket-display').innerText = '#' + escapeHTML(currentTicket);
            document.getElementById('messages').innerHTML = '';

            try {
                const res = await fetch(`${BACKEND_API}/api/history/${encodeURIComponent(currentTicket)}`, {
                    headers: { "Accept": "application/json" }
                });
                
                if (res.ok) {
                    const history = await res.json();
                    if (Array.isArray(history)) {
                        history.forEach(msg => drawMsg(msg));
                    }
                }

                ws = new WebSocket(`${BACKEND_WS}/ws/buyer?ticket=${encodeURIComponent(currentTicket)}`);
                
                ws.onmessage = (event) => {
                    try {
                        if (event.data.length > 5000) return;
                        const data = JSON.parse(event.data);
                        drawMsg(data);
                    } catch (err) {}
                };

                ws.onerror = () => {
                    if (ws.readyState === WebSocket.OPEN) ws.close();
                };

            } catch (error) {
                alert("Yah, gagal nyambung ke server. Coba refresh lagi ya! 🔌");
            } finally {
                isConnecting = false;
            }
        }

        function drawMsg(data) {
            if (!data || typeof data !== 'object') return;

            const safeSender = escapeHTML(validateString(data.sender, 50));
            const safeContent = escapeHTML(validateString(data.content, 2000));

            if (!safeSender || !safeContent) return;

            if (safeContent === "DELETED") {
                alert("Obrolan udah diselesaikan. Have a nice day! ✨");
                try {
                    localStorage.removeItem('sanlucid_ticket');
                    localStorage.removeItem('sanlucid_name');
                } catch (e) {}
                location.reload(); 
                return;
            }

            const div = document.createElement('div');
            div.className = data.sender === currentName ? 'msg me' : 'msg other';
            div.innerHTML = `<span class="sender-name">${safeSender}</span>${safeContent}`;
            
            const box = document.getElementById('messages');
            box.appendChild(div);
            box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
        }

        function sendMsg() {
            const now = Date.now();
            if (now - lastMsgTime < 500) return; 

            const inputNode = document.getElementById('msgInput');
            const content = validateString(inputNode.value, 2000);
            
            if (content && ws && ws.readyState === WebSocket.OPEN) {
                lastMsgTime = now;
                const chatData = { 
                    ticket: currentTicket, 
                    sender: currentName, 
                    content: content 
                };
                
                try {
                    ws.send(JSON.stringify(chatData));
                    inputNode.value = '';
                    inputNode.focus(); 
                } catch (e) {}
            }
        }

        async function endChat() {
            if (isEndingChat || !currentTicket) return;

            if(confirm("Yakin mau udahan? Obrolan ini bakal dihapus permanen loh. 🗑️")) {
                isEndingChat = true;
                try {
                    await fetch(`${BACKEND_API}/api/end-chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ ticket: currentTicket })
                    });
                    
                    try {
                        localStorage.removeItem('sanlucid_ticket');
                        localStorage.removeItem('sanlucid_name');
                    } catch (e) {}
                } catch (err) {
                    alert("Gagal mengakhiri chat, coba lagi ya!");
                } finally {
                    isEndingChat = false;
                }
            }
        }
    </script>
</body>
</html>
